<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <meta name="description" content="A focused, offline strength exercise timer.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Strength Session</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Strength session</p>
        <h1 id="exercise-title">Exercise</h1>
      </div>
      <button id="install-button" class="icon-button install-button" type="button" hidden aria-label="Install app" title="Install app">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 20h14"/></svg>
      </button>
    </header>

    <section class="position-stage" aria-label="Exercise positions">
      <img id="position-image" alt="">
      <div id="image-loading" class="image-loading">Loading exercise...</div>
    </section>

    <section class="timer-panel" aria-label="Exercise timer">
      <p class="timer-label">Time at exercise</p>
      <output id="timer" class="timer" aria-live="off">00:00</output>
      <div class="timer-actions">
        <button id="reset-button" class="icon-button" type="button" aria-label="Reset timer" title="Reset timer">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4v6h6M5.5 15a7 7 0 1 0 .5-7.5L4 10"/></svg>
        </button>
        <button id="start-button" class="start-button" type="button">
          <svg class="play-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></svg>
          <svg class="pause-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
          <span>Start</span>
        </button>
        <div class="set-stepper" aria-label="Completed sets">
          <button id="set-minus" type="button" aria-label="Remove completed set">−</button>
          <span><strong id="set-count">0</strong><small>sets</small></span>
          <button id="set-plus" type="button" aria-label="Add completed set">+</button>
        </div>
      </div>
    </section>

    <details class="description-panel">
      <summary>
        <span>Description</span>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <div class="description-content">
        <p id="exercise-description"></p>
        <button id="full-sheet-button" class="text-button" type="button">View full exercise sheet</button>
      </div>
    </details>

    <nav class="exercise-nav" aria-label="Exercise navigation">
      <button id="previous-button" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        <span>Previous</span>
      </button>
      <p><strong id="exercise-number">1</strong><span>of</span><span id="exercise-total">18</span></p>
      <button id="next-button" type="button">
        <span>Next</span>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </nav>
  </main>

  <dialog id="sheet-dialog">
    <div class="dialog-header">
      <strong id="sheet-title">Exercise sheet</strong>
      <button id="close-dialog" class="icon-button" type="button" aria-label="Close exercise sheet">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <img id="full-sheet-image" alt="">
  </dialog>

  <script src="app.js"></script>
</body>
</html>
